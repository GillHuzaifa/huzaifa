<div id="top" [attr.data-view]="currentView()">
  <app-header></app-header>
  <main id="content">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
  <app-pulse-ai></app-pulse-ai>
  <app-modal></app-modal>
  <app-toast></app-toast>

  <!-- Mobile Bottom Tab Bar for Patient/Public Site (< 900px) -->
  <nav *ngIf="currentView() !== 'clinics'" class="public-mobile-nav" aria-label="Bottom Navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>
    <a routerLink="/find-doctors" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Doctors</span>
    </a>
    <a routerLink="/hospitals" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="2" width="18" height="20" rx="3"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="12" y1="9" x2="12" y2="15"/>
      </svg>
      <span>Hospitals</span>
    </a>
    <a routerLink="/medicine" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
        <path d="m8.5 8.5 7 7"/>
      </svg>
      <span>Medicine</span>
    </a>
    <a routerLink="/surgery" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 8v8"/>
        <path d="M8 12h8"/>
      </svg>
      <span>Surgery</span>
    </a>
  </nav>
</div>

<!-- Global SVG symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="robotIcon" viewBox="0 0 64 64">
    <path d="M32 8v8" />
    <circle cx="32" cy="7" r="3" fill="currentColor"/>
    <rect x="12" y="16" width="40" height="32" rx="12" />
    <path d="M6 30v8M58 30v8" />
    <circle cx="24" cy="31" r="3.5" fill="currentColor" stroke="none"/>
    <circle cx="40" cy="31" r="3.5" fill="currentColor" stroke="none"/>
    <path d="M24 40c4 3 12 3 16 0"/>
    <path d="M22 48v6h20v-6"/>
  </symbol>
</svg>
