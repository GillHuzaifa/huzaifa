<div id="top" [attr.data-view]="currentView()">
  <app-header></app-header>
  <main id="content">
    <router-outlet></router-outlet>
  </main>
  <app-footer></app-footer>
  <app-modal></app-modal>
  <app-toast></app-toast>

  <!-- Mobile Bottom Tab Bar for Patient/Public Site (< 900px) -->
  <nav *ngIf="currentView() !== 'clinics'" class="public-mobile-nav" aria-label="Bottom Navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>
    <a routerLink="/find-doctors" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Doctors</span>
    </a>
    <a routerLink="/hospitals" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="2" width="18" height="20" rx="3"/>
        <line x1="9" y1="12" x2="15" y2="12"/>
        <line x1="12" y1="9" x2="12" y2="15"/>
      </svg>
      <span>Hospitals</span>
    </a>
    <a routerLink="/medicine" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
        <path d="m8.5 8.5 7 7"/>
      </svg>
      <span>Medicine</span>
    </a>
    <a routerLink="/life-map" routerLinkActive="active" class="pub-mob-tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/>
        <path d="M9 4v14M15 6v14"/>
      </svg>
      <span>Lifemap</span>
    </a>
  </nav>

  <!-- Mobile "More" Bottom Sheet (< 900px) -->
  <div *ngIf="showMoreSheet" class="more-sheet-backdrop" (click)="closeMoreSheet()" role="dialog" aria-modal="true" aria-label="More navigation options">
    <div class="more-sheet-panel" (click)="$event.stopPropagation()" (touchstart)="onMoreTouchStart($event)" (touchend)="onMoreTouchEnd($event)">
      <div class="more-sheet-handle"></div>
      <div class="more-sheet-top">
        <b>More services</b>
        <button type="button" class="more-sheet-x" (click)="closeMoreSheet()" aria-label="Close">✕</button>
      </div>
      <div class="more-sheet-grid">
        <a routerLink="/surgery" (click)="closeMoreSheet()" class="more-item">
          <span class="more-item-ic">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2381FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v10M7 12h10"/>
            </svg>
          </span>
          <div class="more-item-text">
            <b>Surgery</b>
            <small>Surgeons & quotes</small>
          </div>
        </a>
        <a routerLink="/clinics" (click)="closeMoreSheet()" class="more-item">
          <span class="more-item-ic">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2381FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4"/>
              <path d="M9 12h6M12 9v6"/>
            </svg>
          </span>
          <div class="more-item-text">
            <b>For clinics</b>
            <small>Clinic dashboard</small>
          </div>
        </a>
        <a routerLink="/about" (click)="closeMoreSheet()" class="more-item">
          <span class="more-item-ic">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2381FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="16" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
          </span>
          <div class="more-item-text">
            <b>About us</b>
            <small>Story & directors</small>
          </div>
        </a>
        <a routerLink="/contact" (click)="closeMoreSheet()" class="more-item">
          <span class="more-item-ic">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2381FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </span>
          <div class="more-item-text">
            <b>Contact us</b>
            <small>Phone & WhatsApp</small>
          </div>
        </a>
        <a routerLink="/terms" (click)="closeMoreSheet()" class="more-item">
          <span class="more-item-ic">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2381FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </span>
          <div class="more-item-text">
            <b>Terms of use</b>
            <small>User agreement</small>
          </div>
        </a>
        <a routerLink="/privacy" (click)="closeMoreSheet()" class="more-item">
          <span class="more-item-ic">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2381FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <div class="more-item-text">
            <b>Privacy policy</b>
            <small>Patient data safety</small>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
